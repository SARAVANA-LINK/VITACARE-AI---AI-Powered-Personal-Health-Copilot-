version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitacare-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://vitacare_user:vitacare_secure_pass@postgres:5432/vitacare_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=vitacare_production_master_secret_key_2026_super_secure_clinical_jwt
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_DIR=/app/uploads
      - AI_PROVIDER=local_rag
      - SMS_PROVIDER=mock
      - EMAIL_PROVIDER=console
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: vitacare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitacare_user
      POSTGRES_PASSWORD: vitacare_secure_pass
      POSTGRES_DB: vitacare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitacare_user -d vitacare_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vitacare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  uploads_data:
